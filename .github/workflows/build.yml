name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Serve per creare le release con il token del workflow
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # versionCode crescente: ogni APK si installa sopra il precedente
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Prepara la chiave di firma (dai Secrets)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_B64_2: ${{ secrets.KEYSTORE_B64_2 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret KEYSTORE_B64 mancante: creo l'APK con firma di debug"
            exit 0
          fi
          # La chiave è divisa in due secret: della prima parte servono i primi 1714 caratteri
          if [ -n "$KEYSTORE_B64_2" ]; then
            printf '%s' "$KEYSTORE_B64" | tr -d ' \n\r' | head -c 1714 > ks.b64
            printf '%s' "$KEYSTORE_B64_2" | tr -d ' \n\r' >> ks.b64
          else
            printf '%s' "$KEYSTORE_B64" | tr -d ' \n\r' > ks.b64
          fi
          n=$(wc -c < ks.b64)
          if ! base64 -d ks.b64 > "$RUNNER_TEMP/release.keystore" 2> ks.err; then
            echo "::error::KEYSTORE_B64 non valido (lunghezza $n, attesa 3428): $(head -c 200 ks.err) inizio=$(head -c 12 ks.b64) fine=$(tail -c 12 ks.b64)"
            exit 1
          fi
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Compila APK (release, firmato)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set +e
          gradle assembleRelease --no-daemon --console=plain --stacktrace > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -E '^e: ' build.log | sed 's#file:///home/runner/work/[^/]*/[^/]*/##' | head -9 | while IFS= read -r l; do echo "::error::$l"; done
            echo "::error::$(grep -A10 'What went wrong' build.log | head -14 | tr '\n' '|')"
            echo "::error::$(tail -n 30 build.log | tr '\n' '|' | cut -c1-3500)"
          fi
          exit $code

      - name: Pubblica la release
        run: |
          TAG="v1.0.${{ github.run_number }}"
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" "MLMeteo-$TAG.apk"
          SUBJECT=$(git log -1 --pretty=%s)
          gh release create "$TAG" "MLMeteo-$TAG.apk" \
            --title "MLMeteo $TAG" \
            --notes "Ultima versione. Scarica **MLMeteo-$TAG.apk** qui sotto e installalo sopra la precedente.

          Modifica: $SUBJECT" \
            --target "$GITHUB_SHA" \
            --latest

      - name: Tieni solo le ultime 5 release
        run: |
          gh release list --limit 100 --json tagName --jq '.[5:][].tagName' | while IFS= read -r t; do
            gh release delete "$t" --cleanup-tag --yes
          done

  windows:
    needs: build
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Compila l'app per Windows (versione portatile)
        shell: bash
        run: |
          set +e
          gradle :desktop:createDistributable -x downloadWix -x unzipWix --no-daemon --console=plain --stacktrace > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -E '^e: ' build.log | sed 's#file:///[^ ]*/desktop/#desktop/#; s#file:///[^ ]*/shared/#shared/#' | head -12 | while IFS= read -r l; do echo "::error::$l"; done
            echo "::error::$(grep -A10 'What went wrong' build.log | head -14 | tr '\n' '|')"
          fi
          exit $code

      - name: Compila l'installer (MSI)
        shell: bash
        continue-on-error: true
        run: |
          # WiX da NuGet (GitHub a volte risponde 504), messo dove lo cerca Compose (build/wix311)
          for i in 1 2 3; do
            curl -sSL --fail -o wix.nupkg https://www.nuget.org/api/v2/package/wix/3.11.2 && break
            sleep 15
          done
          mkdir -p wixpkg build/wix311
          unzip -q -o wix.nupkg -d wixpkg
          cp -r wixpkg/tools/* build/wix311/
          ls build/wix311 | head
          gradle :desktop:packageMsi -x downloadWix -x unzipWix --no-daemon --console=plain > msi.log 2>&1 || { grep -A12 "What went wrong" msi.log; tail -20 msi.log; exit 1; }

      - name: Controllo automatico (cerca e aggiunge località, controlla memoria e ridisegni)
        shell: bash
        run: |
          timeout 240 gradle :desktop:run --args="--selftest" --no-daemon --console=plain > selftest.log 2>&1 || true
          grep SELFTEST selftest.log | sort -u | head -40
          MAXN=$(grep -o 'n=[0-9]*' selftest.log | cut -d= -f2 | sort -n | tail -1)
          echo "Località massime durante il test: $MAXN"
          if [ -z "$MAXN" ] || [ "$MAXN" -gt 3 ]; then echo "::error::Controllo automatico fallito (località: $MAXN)"; exit 1; fi

      - name: Aggiungi Windows alla release
        shell: pwsh
        run: |
          $tag = "v1.0.${{ github.run_number }}"
          Compress-Archive -Path desktop/build/compose/binaries/main/app/MLMeteo -DestinationPath "MLMeteo-Windows-$tag-portatile.zip"
          gh release upload $tag "MLMeteo-Windows-$tag-portatile.zip" --clobber
          $msi = Get-ChildItem desktop/build/compose/binaries/main/msi/*.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi) {
            Copy-Item $msi.FullName "MLMeteo-Windows-$tag.msi"
            gh release upload $tag "MLMeteo-Windows-$tag.msi" --clobber
          }
