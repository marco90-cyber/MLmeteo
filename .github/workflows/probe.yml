name: Probe ICON-2I
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: File precipitazione
        run: |
          B=https://meteohub.agenziaitaliameteo.it/nwp
          R=$(curl -sSL $B/ICON_2I_RUC/ | grep -o 'href="[0-9]*/"' | tail -1 | cut -d'"' -f2 | tr -d /)
          U="$B/ICON_2I_RUC/$R/TOT_PREC/ICON_2I_RUC_${R}_surface-0.grib"
          echo "$U"
          curl -sSI "$U" | grep -iE "accept-ranges|content-length|HTTP"
          sudo apt-get install -y -qq libeccodes-tools > /dev/null
          python3 - "$U" <<'PY'
          import sys, urllib.request, struct
          u=sys.argv[1]; off=0; msgs=[]
          while len(msgs)<80:
              req=urllib.request.Request(u, headers={'Range':'bytes=%d-%d'%(off,off+15)})
              try: b=urllib.request.urlopen(req).read()
              except Exception as e: print('fine',e); break
              if len(b)<16 or b[:4]!=b'GRIB': break
              ln=struct.unpack('>Q',b[8:16])[0]; msgs.append((off,ln)); off+=ln
          print('messaggi',len(msgs),'primi',msgs[:3])
          o,l=msgs[1]
          req=urllib.request.Request(u, headers={'Range':'bytes=%d-%d'%(o,o+l-1)}); open('m.grib','wb').write(urllib.request.urlopen(req).read())
          o,l=msgs[-1]
          req=urllib.request.Request(u, headers={'Range':'bytes=%d-%d'%(o,o+l-1)}); open('last.grib','wb').write(urllib.request.urlopen(req).read())
          PY
          grib_ls -p shortName,stepRange,stepType,packingType,gridType,Ni,Nj,bitsPerValue m.grib last.grib
          grib_dump -O m.grib | grep -iE "packing|gridType|latitudeOfFirst|longitudeOfFirst|latitudeOfLast|longitudeOfLast|iDirectionIncrement|jDirectionIncrement|Ni =|Nj =|scanningMode|latitudeOfSouthernPole|longitudeOfSouthernPole|angleOfRotation|bitsPerValue|referenceValue|binaryScaleFactor|decimalScaleFactor|numberOfValues|bitMapIndicator|TemplateNumber|ccsds|order|missing" | head -50
          grib_get_data m.grib | awk 'NR>1 && $3>0.5' | head -5
