name: Probe GFS
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: NOMADS area con longitudini negative
        run: |
          sudo apt-get install -y -qq libeccodes-tools > /dev/null 2>&1
          D=$(date -u +%Y%m%d)
          for R in 18 12 06 00; do
            U="https://nomads.ncep.noaa.gov/cgi-bin/filter_gfs_0p25_1hr.pl?dir=%2Fgfs.$D%2F$R%2Fatmos&file=gfs.t${R}z.pgrb2.0p25.f006&var_PRATE=on&lev_surface=on&subregion=&toplat=55.0&leftlon=-15.0&rightlon=40.0&bottomlat=30.0"
            code=$(curl -sS -o g.grib -w "%{http_code}" "$U"); echo "run $R: $code $(stat -c %s g.grib)"
            [ "$code" = "200" ] && head -c 4 g.grib | grep -q GRIB && break
          done
          grib_ls -p shortName,stepType,packingType,Ni,Nj g.grib
          grib_dump -O g.grib | grep -E "longitudeOfFirst|longitudeOfLast|latitudeOfFirst|latitudeOfLast" | head
          grib_get_data g.grib | awk 'NR==2 || NR==3 || NR==223' 
