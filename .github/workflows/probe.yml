name: Probe allerte
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Allerte
        run: |
          R=pcm-dpc/DPC-Bollettini-Criticita-Idrogeologica-Idraulica
          SHA=$(curl -sS "https://api.github.com/repos/$R/commits?path=files/geojson&per_page=1" | python3 -c "import json,sys;print(json.load(sys.stdin)[0]['sha'])")
          curl -sS "https://api.github.com/repos/$R/commits/$SHA" | python3 -c "import json,sys;d=json.load(sys.stdin);[print(f['filename']) for f in d['files']]" | tee l.txt
          J=$(grep geojson l.txt | grep today | head -1)
          curl -sSL "https://raw.githubusercontent.com/$R/master/$J" -o b.json; ls -la b.json
          python3 - <<'PY'
          import json, collections
          d=json.load(open('b.json'))
          fs=d['features']; print('features',len(fs))
          for f in fs[:3]:
              print(json.dumps(f['properties'],ensure_ascii=False)[:1200]); print(f['geometry']['type'], str(f['geometry']['coordinates'])[:100])
          c=collections.Counter()
          for f in fs:
              for k,v in f['properties'].items():
                  if not isinstance(v,(dict,list)) and len(str(v))<20: c[(k,str(v))]+=1
          print(c.most_common(50))
          PY
