name: Probe radar DPC
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prova decodifica
        run: |
          T=$(curl -sS "https://radar-api.protezionecivile.it/findLastProductByType?type=SRI" | python3 -c "import json,sys;print(json.load(sys.stdin)['lastProducts'][0]['time'])")
          U=$(curl -sS -X POST "https://radar-api.protezionecivile.it/downloadProduct" -H "content-type: application/json" -d "{\"productType\":\"SRI\",\"productDate\":$T}" | python3 -c "import json,sys;print(json.load(sys.stdin)['url'])")
          curl -sS -o sri.tif "$U"
          sudo apt-get install -y -qq gdal-bin python3-numpy > /dev/null
          gdal_translate -q -of ENVI sri.tif ref.raw
          printf "12.5 42\n7.6 45.07\n15.08 37.5\n18.1 40.35\n9.19 45.46\n" > pts_in.txt
          P=$(gdalsrsinfo -o proj4 sri.tif | tr -d "'")
          echo "$P"
          gdaltransform -s_srs EPSG:4326 -t_srs "$P" < pts_in.txt > pts_out.txt
          python3 .github/test_dpc.py
