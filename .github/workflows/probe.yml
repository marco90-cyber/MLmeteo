name: Probe desktop
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.10.2 }
      - name: Selftest
        shell: bash
        run: |
          timeout 300 gradle :desktop:run --args="--selftest" --no-daemon --console=plain > t.log 2>&1 || true
          grep -E "SELFTEST|^e: |Exception|rror" t.log | head -60
          tail -30 t.log
