name: Probe modelli
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: WRF
        run: |
          sudo apt-get install -y -qq libeccodes-tools > /dev/null 2>&1
          B=https://meteohub.agenziaitaliameteo.it/nwp/WRF
          R=$(curl -sSL $B/ | grep -o 'href="[0-9]*/"' | tail -1 | cut -d'"' -f2)
          for V in tp 2t 10u gust tcc srweq vis; do
            F=$(curl -sSL $B/$R$V/ | grep -o 'href="[^"]*grib"' | head -1 | cut -d'"' -f2)
            echo "######## $V $F"
            python3 -c "
          import urllib.request,struct
          u='$B/$R$V/$F';off=0;L=[]
          for k in range(80):
              try: h=urllib.request.urlopen(urllib.request.Request(u,headers={'Range':'bytes=%d-%d'%(off,off+15)})).read()
              except Exception: break
              if h[:4]!=b'GRIB': break
              ln=struct.unpack('>Q',h[8:16])[0];L.append(ln)
              if k==6: open('x.grib','wb').write(urllib.request.urlopen(urllib.request.Request(u,headers={'Range':'bytes=%d-%d'%(off,off+ln-1)})).read())
              off+=ln
          print('messaggi',len(L),'media KB',sum(L)//len(L)//1024)"
            grib_ls -p shortName,stepRange,stepType,packingType,bitmapPresent x.grib | sed -n 2,3p
            python3 .github/probe_wrf.py 2>&1 | tail -12
          done
