name: Probe modelli HD
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Modelli
        run: |
          sudo apt-get install -y -qq libeccodes-tools > /dev/null 2>&1
          B=https://meteohub.agenziaitaliameteo.it/nwp
          R=$(curl -sSL $B/WRF/ | grep -o 'href="[0-9]*/"' | tail -1 | cut -d'"' -f2)
          for V in t lcc prmsl cape; do echo "WRF $V:"; curl -sSL "$B/WRF/$R$V/" | grep -o 'href="[^"]*grib"' | cut -d'"' -f2 | head -12 | tr '\n' ' '; echo; done
          F=$(curl -sSL "$B/WRF/${R}lcc/" | grep -o 'href="[^"]*grib"' | head -1 | cut -d'"' -f2); curl -sS -r 0-3000000 -o w.grib "$B/WRF/${R}lcc/$F"; grib_ls -p shortName,units,typeOfLevel,step w.grib 2>/dev/null| head -4; grib_get -p max w.grib 2>/dev/null | head -2
          R=$(curl -sSL $B/ICON_2I_RUC/ | grep -o 'href="[0-9]*/"' | tail -1 | cut -d'"' -f2)
          for V in T SNOWLMT CLCL H_SNOW PMSL; do echo "I2 $V:"; curl -sSL "$B/ICON_2I_RUC/$R$V/" | grep -o 'href="[^"]*grib"' | cut -d'"' -f2 | head -12 | tr '\n' ' '; echo; done
          F=$(curl -sSL "$B/ICON_2I_RUC/${R}SNOWLMT/" | grep -o 'href="[^"]*grib"' | head -1 | cut -d'"' -f2); curl -sS -o s.grib "$B/ICON_2I_RUC/${R}SNOWLMT/$F"; grib_ls -p shortName,units,typeOfLevel,step,packingType,bitmapPresent s.grib | head -4; grib_count s.grib
          F=$(curl -sSL "$B/ICON_2I_RUC/${R}H_SNOW/" | grep -o 'href="[^"]*grib"' | head -1 | cut -d'"' -f2); curl -sS -r 0-4000000 -o h.grib "$B/ICON_2I_RUC/${R}H_SNOW/$F"; grib_ls -p shortName,units,step,packingType h.grib 2>/dev/null | head -3
          curl -sSL https://opendata.dwd.de/weather/nwp/icon-d2/grib/12/t/ | grep -o 'href="[^"]*pressure-level[^"]*_006_850[^"]*"' | head -2
          curl -sSL https://opendata.dwd.de/weather/nwp/icon-d2/grib/12/tot_prec/ | grep -o '_[0-9]*_2d_tot_prec' | tail -2
