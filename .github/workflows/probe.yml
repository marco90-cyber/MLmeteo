name: Probe modelli
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: MOLOCH e WRF
        run: |
          sudo apt-get install -y -qq libeccodes-tools > /dev/null 2>&1
          B=https://meteohub.agenziaitaliameteo.it/nwp
          L() { curl -sSL "$1" | sed 's/<[^>]*>/ /g' | tr -s ' ' | grep -v '^ *$' | head -${2:-12}; }
          for M in MOLOCH_AIM WRF; do
            echo "######## $M"; L $B/$M/ 8
            R=$(curl -sSL $B/$M/ | grep -o 'href="[^"]*/"' | grep -v '\.\.' | tail -1 | cut -d'"' -f2)
            echo "ultimo: $R"; L $B/$M/$R 40
            S=$(curl -sSL $B/$M/$R | grep -o 'href="[^"]*"' | grep -v '\.\.' | grep -iE 'tot_prec|tp|prec' | head -1 | cut -d'"' -f2)
            [ -z "$S" ] && S=$(curl -sSL $B/$M/$R | grep -o 'href="[^"]*"' | grep -v '\.\.' | sed -n 2p | cut -d'"' -f2)
            echo "sotto: $S"; L $B/$M/$R$S 10
            F=$(curl -sSL $B/$M/$R$S | grep -o 'href="[^"]*\.grib[^"]*"' | head -1 | cut -d'"' -f2)
            if [ -n "$F" ]; then
              curl -sSL -r 0-4000000 -o x.grib "$B/$M/$R$S$F"
              grib_ls -p shortName,stepRange,packingType,gridType,Ni,Nj x.grib 2>&1 | head -4
              grib_dump -O x.grib 2>/dev/null | grep -E "latitudeOfFirst|longitudeOfFirst|latitudeOfLast|longitudeOfLast|iDirectionIncrement|jDirectionIncrement|latitudeOfSouthernPole|longitudeOfSouthernPole" | head -10
            fi
          done
