name: Probe desktop
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.10.2 }
      - name: Test
        run: |
          gradle :desktop:test --no-daemon --console=plain > t.log 2>&1 || true
          grep -E "PROBE|^e: |FAIL|Exception" t.log | head -60
          tail -40 t.log
