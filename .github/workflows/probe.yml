name: Probe allerte
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Allerte
        run: |
          R=pcm-dpc/DPC-Bollettini-Criticita-Idrogeologica-Idraulica
          for SHA in $(curl -sS "https://api.github.com/repos/$R/commits?per_page=6" | python3 -c "import json,sys;[print(c['sha']) for c in json.load(sys.stdin)]"); do
            curl -sS "https://api.github.com/repos/$R/commits/$SHA" | python3 -c "import json,sys;d=json.load(sys.stdin);[print(f['filename']) for f in d['files']]"
          done > list.txt
          cat list.txt
          J=$(grep -E '\.json$' list.txt | grep -i oggi | head -1); [ -z "$J" ] && J=$(grep -E '\.json$' list.txt | head -1)
          echo "JSON $J"
          curl -sSL "https://raw.githubusercontent.com/$R/master/$J" -o b.json; ls -la b.json
          python3 - <<'PY'
          import json, collections
          d=json.load(open('b.json'))
          print(type(d), list(d.keys())[:10] if isinstance(d,dict) else len(d))
          fs=d.get('features',[])
          print('features',len(fs))
          for f in fs[:2]:
              print(json.dumps(f['properties'],ensure_ascii=False)[:900]); print(f['geometry']['type'], str(f['geometry']['coordinates'])[:120])
          c=collections.Counter()
          for f in fs:
              for k,v in f['properties'].items():
                  if not isinstance(v,(dict,list)) and len(str(v))<25: c[(k,str(v))]+=1
          print([x for x in c.most_common(60)])
          PY
          echo "#### MeteoAlarm"
          curl -sS -o ma.xml -w "%{http_code} %{size_download}\n" "https://feeds.meteoalarm.org/feeds/meteoalarm-legacy-atom-italy"
          python3 -c "
          s=open('ma.xml').read();print(s[:800]);e=s.split('<entry>');print('entries',len(e)-1)
          print(e[1][:2500] if len(e)>1 else '')"
