name: Probe modelli HD
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Modelli
        run: |
          sudo apt-get install -y -qq libeccodes-tools > /dev/null 2>&1
          F=$(curl -sSL https://opendata.dwd.de/weather/nwp/icon-eu/grib/12/t_2m/ | grep -o 'href="[^"]*regular-lat-lon[^"]*_006_[^"]*"' | head -1 | cut -d'"' -f2)
          curl -sSL -o e.bz2 "https://opendata.dwd.de/weather/nwp/icon-eu/grib/12/t_2m/$F"; bunzip2 -f e.bz2
          echo "== ICON-EU t2m"; python3 .github/aec_test.py e
          F=$(curl -sSL https://opendata.dwd.de/weather/nwp/icon-eu/grib/12/tot_prec/ | grep -o 'href="[^"]*regular-lat-lon[^"]*_006_[^"]*"' | head -1 | cut -d'"' -f2)
          curl -sSL -o p.bz2 "https://opendata.dwd.de/weather/nwp/icon-eu/grib/12/tot_prec/$F"; bunzip2 -f p.bz2
          echo "== ICON-EU tp"; python3 .github/aec_test.py p
          D=$(date -u +%Y%m%d)
          I="https://data.ecmwf.int/forecasts/$D/00z/ifs/0p25/oper/${D}000000-6h-oper-fc.index"
          echo "== ECMWF index"; curl -sS "$I" | head -2
          curl -sS "$I" | python3 -c "import json,sys;print(sorted(set(json.loads(l)['param'] for l in sys.stdin if l.strip())))" || true
          O=$(curl -sS "$I" | grep '"param": "2t"' | head -1 | python3 -c "import json,sys;d=json.loads(sys.stdin.read());print(d['_offset'],d['_length'])") || true
          set -- $O
          if [ -n "$1" ]; then curl -sS -r $1-$(($1+$2-1)) -o x.grib "https://data.ecmwf.int/forecasts/$D/00z/ifs/0p25/oper/${D}000000-6h-oper-fc.grib2"
            grib_ls -p shortName,packingType,gridType,Ni,Nj,bitsPerValue x.grib | sed -n 2p
            grib_dump -O x.grib | grep -E "latitudeOfFirst|longitudeOfFirst|scanningMode" | head -3
            python3 .github/aec_test.py x.grib || true; fi
          echo "== ECMWF steps"; curl -sS "https://data.ecmwf.int/forecasts/$D/00z/ifs/0p25/oper/" | grep -o '[0-9]*h-oper-fc.grib2' | sort -u | head -80 | tr '\n' ' '
          echo; echo "== MOLOCH vars precip"; curl -sSL https://meteohub.agenziaitaliameteo.it/nwp/MOLOCH_AIM/ | grep -o 'href="[0-9]*/"' | tail -1
