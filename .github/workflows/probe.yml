name: Probe allerte
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Topojson
        run: |
          R=pcm-dpc/DPC-Bollettini-Criticita-Idrogeologica-Idraulica
          SHA=$(curl -sS "https://api.github.com/repos/$R/commits?path=files/topojson&per_page=1" | python3 -c "import json,sys;print(json.load(sys.stdin)[0]['sha'])")
          ST=$(curl -sS "https://api.github.com/repos/$R/commits/$SHA" | python3 -c "import json,sys,re;d=json.load(sys.stdin);print([re.search(r'(\d{8}_\d{4})_',f['filename']).group(1) for f in d['files']][0])")
          echo "stamp $ST"
          curl -sSL "https://raw.githubusercontent.com/$R/master/files/topojson/${ST}_tomorrow.json" -o t.json; ls -la t.json
          python3 - <<'PY'
          import json,collections
          d=json.load(open('t.json'))
          for k,o in d['objects'].items():
              g=o['geometries']; print(k,len(g)); p=g[0]['properties']; print({kk:(str(v)[:60]) for kk,v in p.items()})
              c=collections.Counter(x['properties'].get('Per rischio temporali','?')[:60] for x in g); print(c)
              print('Petralia' , [x['properties']['Nome zona'] for x in g if 'Petralia Sottana' in x['properties'].get('Comuni',[])])
          PY
